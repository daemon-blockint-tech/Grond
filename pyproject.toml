[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# Optional CLI: theHarvester (https://github.com/laramies/theHarvester) is not pinned here —
# install with: uv pip install "git+https://github.com/laramies/theHarvester"
# Env: THEHARVESTER_BIN, optional API keys per upstream api-keys.yaml / wiki.
name = "grond"
version = "0.2.0"
description = "Agentic Open Source Intelligence (OSINT) Platform"
requires-python = ">=3.12"
dependencies = [
    # --- API ---
    "fastapi>=0.115.0",
    "python-multipart>=0.0.9",  # FormData / file upload (e.g. /api/v1/tools/metadata)
    "uvicorn[standard]>=0.30.0",

    # --- LLM (reporter + enrichment) ---
    "anthropic>=0.37.0",
    "langchain>=0.3.0",
    "langgraph>=0.2.0",
    "langchain-anthropic>=1.4.6",

    # --- Data models ---
    "pydantic>=2.9.0",
    "pydantic-settings>=2.14.2",

    # --- OSINT tools ---
    "python-nmap>=0.7.1",
    "tavily-python>=0.5.0",
    "shodan>=1.31.0",
    "httpx>=0.27.0",

    # Bellingcat SEC EDGAR full-text search (https://github.com/bellingcat/EDGAR — PyPI edgar-tool)
    "edgar-tool>=2.1.0",

    # --- Primary storage (PostgreSQL + pgvector) ---
    "asyncpg>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "alembic>=1.14.0",
    "pgvector>=0.3.0",

    # --- Graph (Neo4j) ---
    "neo4j>=5.25.0",

    # --- Full-text search (OpenSearch) ---
    "opensearch-py>=2.7.0",

    # --- Artifact store (S3-compatible) ---
    "aiobotocore>=2.15.0",

    # --- Embeddings ---
    "qdrant-client>=1.12.0",
    "sentence-transformers>=3.0.0",

    # --- Observability ---
    "opentelemetry-sdk>=1.28.0",
    "opentelemetry-api>=1.28.0",
    "opentelemetry-instrumentation-fastapi>=0.49b0",
    "opentelemetry-instrumentation-httpx>=0.49b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.49b0",
    "opentelemetry-exporter-otlp-proto-http>=1.28.0",
    "sentry-sdk[fastapi]>=2.18.0",

    # --- Logging ---
    "structlog>=24.4.0",

    # --- Reports ---
    "weasyprint>=62.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "vcrpy>=8.2.1",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "httpx>=0.27.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true

# Editable install: source lives under src/* (not a top-level grond/ package)
[tool.hatch.build.targets.wheel]
packages = [
  "src/api",
  "src/core",
  "src/embeddings",
  "src/graph",
  "src/models",
  "src/observability",
  "src/pipeline",
  "src/storage",
  "src/tools",
]
